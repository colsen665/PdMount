[package]
name = "pdmount"
description = "Mount Proton Drive \"My Files\" as a FUSE filesystem"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "pdmount"
path = "src/main.rs"

[features]
# Test builds: `mount --backend fake:<dir>` and `pdmount fake` (DESIGN.md §15.1).
fake-backend = []

[dependencies]
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
async-trait.workspace = true
dbus-secret-service.workspace = true
futures.workspace = true
hex.workspace = true
keyring.workspace = true
nix.workspace = true
parking_lot.workspace = true
pdmount-backend.workspace = true
pdmount-core.workspace = true
pdmount-fuse.workspace = true
proton-drive-sdk = { workspace = true, features = ["cache-encrypted"] }
rand.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
log.workspace = true
tempfile.workspace = true
tracing-log.workspace = true

[lints]
workspace = true
