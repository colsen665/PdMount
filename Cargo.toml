[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
pdmount-backend = { path = "crates/pdmount-backend" }
pdmount-core = { path = "crates/pdmount-core" }
pdmount-fuse = { path = "crates/pdmount-fuse" }

anyhow = "1.0"
async-trait = "0.1"
blake3 = "1"
bytes = "1.11"
chacha20poly1305 = "0.10"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
# Same version as keyring's Secret Service backend; doctor reads the lock state with it.
dbus-secret-service = "4.1"
dirs = "6"
futures = "0.3"
fuser = "0.18"
globset = "0.4"
hdrhistogram = { version = "7.6", default-features = false }
hex = "0.4"
keyring = { version = "3.6", features = ["linux-native", "sync-secret-service"] }
# Test only: the SDK logs through `log`, bridged into tracing.
log = "0.4"
lru = "0.16"
nix = { version = "0.30", features = ["fs", "mman", "resource", "signal", "user"] }
parking_lot = "0.12"
proptest = "1"
proton-drive-sdk = "0.4"
rand = "0.10"
reqwest = { version = "0.13", features = ["json"] }
# Same version as the SDK: its middleware errors hide the reqwest error (M3.2).
reqwest-middleware = "0.5"
# Same version and features as the SDK: only one crate may link sqlite3.
rusqlite = { version = "0.39", features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.11"
tempfile = "3"
thiserror = "2.0"
tokio = { version = "1.51", features = ["full"] }
toml = "0.9"
tracing = "0.1"
tracing-log = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

# The community SDK is used through a patched fork (decisions D002, D022).
# Patches and their status: docs/sdk-patches.md.
[patch.crates-io]
proton-drive-sdk = { git = "https://github.com/colsen665/proton-sdk-rs2", rev = "caafaea683116e71957d8e6b86de1450afc97ac1" }
proton-sdk-rs2 = { git = "https://github.com/colsen665/proton-sdk-rs2", rev = "caafaea683116e71957d8e6b86de1450afc97ac1" }

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
