[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.6.0"
edition = "2024"
publish = false
license = "MIT"
repository = "https://github.com/colsen665/PdMount"

[workspace.dependencies]
pdmount-backend = { path = "crates/pdmount-backend" }
pdmount-core = { path = "crates/pdmount-core" }
pdmount-fuse = { path = "crates/pdmount-fuse" }

anyhow = "1.0"
async-trait = "0.1"
blake3 = "1"
bytes = "1.11"
chacha20poly1305 = "0.10"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
# Same version as keyring's Secret Service backend; doctor reads the lock state with it.
dbus-secret-service = "4.1"
dirs = "6"
futures = "0.3"
fuser = "0.18"
globset = "0.4"
hdrhistogram = { version = "7.6", default-features = false }
hex = "0.4"
# Photos' thumbnails (M5.13b, D115): Proton's WebP decoded and scaled down. The versions the SDK
# already uses; no image format of `image`'s own, only its scaling.
image = { version = "0.25", default-features = false }
image-webp = "0.2"
keyring = { version = "3.6", features = ["linux-native", "sync-secret-service"] }
# Test only: the SDK logs through `log`, bridged into tracing.
log = "0.4"
lru = "0.16"
# The file names of the freedesktop thumbnail cache (M5.13b).
md-5 = "0.10"
nix = { version = "0.30", features = ["fs", "mman", "resource", "signal", "user"] }
parking_lot = "0.12"
# A thumbnail's PNG with its text chunks (M5.13b); the version `image` uses.
png = "0.18"
proptest = "1"
proton-drive-sdk = "0.5"
rand = "0.10"
reqwest = { version = "0.13", features = ["json"] }
# Same version as the SDK: its middleware errors hide the reqwest error (M3.2).
reqwest-middleware = "0.5"
# Same version and features as the SDK: only one crate may link sqlite3.
rusqlite = { version = "0.39", features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.11"
sha2 = "0.11"
tempfile = "3"
thiserror = "2.0"
tokio = { version = "1.51", features = ["full"] }
toml = "0.9"
tracing = "0.1"
tracing-log = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
# The system bus only: the logind delay lock and PrepareForShutdown (D091; review in
# docs/security/threat-model.md, "Dependencies"). No default features: tokio, no async-io.
zbus = { version = "5.19", default-features = false, features = ["tokio"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

# The community SDK is used through a patched fork (decisions D002, D089).
# Patches and their status: docs/sdk-patches.md.
[patch.crates-io]
proton-drive-sdk = { git = "https://github.com/colsen665/proton-sdk-rs2", rev = "19cc34de6b519d630b6f01750b93d47e3aa863a5" }
proton-sdk-rs2 = { git = "https://github.com/colsen665/proton-sdk-rs2", rev = "19cc34de6b519d630b6f01750b93d47e3aa863a5" }

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
# Debug info is dropped from the archive binary; the symbol table stays, so that a panic backtrace has names.
strip = "debuginfo"
