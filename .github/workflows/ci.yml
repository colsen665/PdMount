# CI (D097): the quick local CI on every push and pull request to master, the full one on demand
# and weekly. Fake backend only: no secrets, no real account (D028, D030), no pull_request_target.
# Actions are pinned by commit (the tag is in the comment). release.yml is generated by dist
# and is not edited by hand (dist-workspace.toml).
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # The pinned toolchain; the same stable release as the local CI. Raise it deliberately.
  RUST_TOOLCHAIN: "1.98.1"
  # Minimum of proton-crypto's Go library is 1.23 (.github/build-setup.yml uses the same).
  GO_VERSION: "1.25.x"
  CARGO_ABOUT_VERSION: "0.9.3"

jobs:
  quick:
    name: quick (scripts/ci.sh --quick)
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler libdbus-1-dev pkg-config clang fuse3
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          rustup default "$RUST_TOOLCHAIN"
      - name: Check THIRD-PARTY-LICENSES.html is current
        run: |
          cargo install --locked "cargo-about@${CARGO_ABOUT_VERSION}" --features cli
          cargo about generate --locked --workspace -c about.toml about.hbs -o "$RUNNER_TEMP/licenses.html"
          diff -q THIRD-PARTY-LICENSES.html "$RUNNER_TEMP/licenses.html"
      - name: Quick CI
        run: scripts/ci.sh --quick

  full:
    name: full (scripts/ci.sh)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler libdbus-1-dev pkg-config clang fuse3 rsync
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          rustup default "$RUST_TOOLCHAIN"
      - name: Full CI
        run: scripts/ci.sh
