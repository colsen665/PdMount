[workspace]
members = ["cargo:."]

# Config for 'dist' (D097). Releases are built only by the hosted CI on a tag;
# the AGENTS.md section "Release" has the procedure.
[dist]
# The dist version used in CI; the same version is installed locally for `dist plan` / `dist build`.
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# No installer scripts: the release is the archive and its checksum.
installers = []
# One platform (D097); glibc >= 2.35 through the runner below.
targets = ["x86_64-unknown-linux-gnu"]
unix-archive = ".tar.gz"
checksum = "sha256"
# No source tarball: GitHub attaches its own source archives to a Release.
source-tarball = false
# LICENSE and README.md are added by dist itself. Extra files: THIRD-PARTY-LICENSES.html is generated by cargo-about
# (about.toml, about.hbs) and checked in; ci.yml fails if it is out of date.
include = ["docs/user-guide.md", "THIRD-PARTY-LICENSES.html"]
# Pull requests run `dist plan` only: nothing is built or uploaded for them.
pr-run-mode = "plan"
# Go (proton-crypto builds a Go library through cgo): a pinned setup-go step.
github-build-setup = "../build-setup.yml"

[dist.github-custom-runners]
global = "ubuntu-22.04"
x86_64-unknown-linux-gnu = "ubuntu-22.04"

[dist.dependencies.apt]
clang = { stage = ["build"] }
libdbus-1-dev = { stage = ["build"] }
pkg-config = { stage = ["build"] }
protobuf-compiler = { stage = ["build"] }
