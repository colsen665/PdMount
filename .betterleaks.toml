# Exemptions for the publishing scan: generic paths only, never private values (D090).
[[allowlists]]
description = "Made-up home directories in unit tests and docs (a longer name is scanned, M6.0.3 V-14)"
regexes = ['''/home/(?:u|user)(?:[^/\w.-]|$)''']

[[allowlists]]
description = "PdMount's files and default mountpoints on the target system"
regexes = [
  '''(?:~|\$HOME)/\.config/pdmount\b''',
  '''(?:~|\$HOME)/\.local/share/pdmount\b''',
  '''(?:~|\$HOME)/\.local/state\}?/pdmount\b''',
  '''(?:~|\$HOME)/\.cache/pdmount\b''',
  '''(?:~|\$HOME)/ProtonDrive\b''',
  '''~/Drive\b''',
  '''~/(?:metrics|node-exporter)/pdmount\.prom\b''',
]

[[allowlists]]
description = "Standard locations on the target system"
regexes = [
  '''~/\.config/(?:autostart|systemd/user|rc/init\.d)\b''',
  '''~/\.cache/thumbnails\b''',
  '''~/\.local(?:/share)?(?:[^/\w.-]|$)''',
  '''~/\.local/bin\b''',
  '''~/\.cache(?:[^/\w.-]|$)''',
  '''~/\.config/rc/conf\.d\b''',
  '''~/\.xprofile\b''',
  '''~/\.config/(?:i3|sway)/config\b''',
  '''(?:~|\$HOME|\$\{CARGO_HOME:-\$HOME)/\.cargo\}?/bin\b''',
]

[[allowlists]]
description = "Default state directories of the test scripts"
regexes = ['''(?:~|\$HOME)/\.cache/pdmount-(?:scenarios|bench)\b''']

[[allowlists]]
description = "Cargo's public source copies, and pdcli's default config, as cited in the docs"
regexes = [
  '''~/\.cargo/(?:registry/src|git/checkouts)\b''',
  '''~/\.config/pdcli\b''',
]

[[allowlists]]
description = "GitHub's runner home (a longer name is scanned, M6.0.3 V-14)"
regexes = ['''/home/runner(?:[^/\w.-]|$)''']

[[allowlists]]
description = "Example mountpoints and placeholder directories in docs and tests, and the M5.6 and M6 scripts' own folders"
regexes = [
  '''(?:~|\$HOME)/(?:a(?:/b)?|b|p|r|s|x|y|pd|Photos|ProtonPhotos|Shared(?:/Team(?:/plan\b)?)?|Other|Alone|Home)(?:[^/\w.-]|$)''',
  '''(?:~|\$HOME)/PdMount-(?:m56\b|m6\b|\$profile\b|%s)''',
]

[[allowlists]]
description = "The made-up example strings that the M6.0.3 security review (C1-7) quotes, in that report and in this file only"
condition = "AND"
paths = ['''^docs/security/2026-11-18-review/area1\.md$''', '''^\.betterleaks\.toml$''']
regexes = [
  '''/home/(?:user\.name|user-backup|runner-x)(?:[^/\w.-]|$)''',
  '''~/(?:pd/<key|Photos/<real|a-private-project/notes|Other/clients/<name>/contract(?:\.pdf)?)(?:[^/\w.-]|$)''',
]
